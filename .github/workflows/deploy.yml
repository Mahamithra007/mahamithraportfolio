name: Deploy Executive Dashboard
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Static App Bundle
        run: |
          export PRESET=github-pages
          export TSC_COMPILE_ON_ERROR=true
          export CI=false
          npm run build

      - name: Flatten Build Directory Layout
        run: |
          # Create a clean, flat staging area for GitHub Pages
          mkdir -p final_upload
          
          # Copy all compiled client files into the staging directory
          cp -r dist/client/* final_upload/
          
          # If TanStack nested the files inside a subfolder, pull them to the root
          if [ -d "final_upload/mahamithraportfolio" ]; then
            cp -r final_upload/mahamithraportfolio/* final_upload/
          fi

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v4

      - name: Package Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy from our verified flat staging directory
          path: 'final_upload'

      - name: Deploy to Live Web
        id: deployment
        uses: actions/deploy-pages@v4
