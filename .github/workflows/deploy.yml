name: Deploy Executive Dashboard
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Static App Bundle
        run: |
          export PRESET=github-pages
          export TSC_COMPILE_ON_ERROR=true
          export CI=false
          
          # Force Vite and TanStack Router to map to your GitHub subfolder
          export VITE_BASE_URL=/mahamithraportfolio/
          export ROUTER_BASE_URL=/mahamithraportfolio/
          
          npm run build
          
          # The magic file that stops GitHub Pages from deleting Vite's folders
          touch dist/client/.nojekyll

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v4

      - name: Package Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Pointing to the exact folder where the successful build actually lands
          path: 'dist/client'

      - name: Deploy to Live Web
        id: deployment
        uses: actions/deploy-pages@v4
